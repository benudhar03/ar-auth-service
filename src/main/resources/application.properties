# =====================================================
# Server Configuration
# =====================================================
server.port=9999
server.servlet.context-path=/
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never
server.error.include-exception=false

# =====================================================
# Application Configuration
# =====================================================
spring.application.name=base-oauth2
spring.profiles.active=dev

# =====================================================
# Database Configuration - PostgreSQL
# =====================================================
# Connection pool settings
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.pool-name=BaseOAuth2HikariPool

# Database connection
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/baseoauth
spring.datasource.username=postgres
spring.datasource.password=system

# =====================================================
# JPA Configuration
# =====================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# DDL Configuration (update only for development, use validate or none in production)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Schema configuration
spring.jpa.properties.hibernate.default_schema=admin

# =====================================================
# SQL Initialization
# =====================================================
# Enable SQL initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=false
spring.sql.init.platform=postgresql

# =====================================================
# File Upload Configuration
# =====================================================
upload.file.path=E:\\uploadFiles
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=30MB
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.location=${upload.file.path}

# =====================================================
# Jackson Configuration
# =====================================================
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

# =====================================================
# Logging Configuration
# =====================================================
logging.level.root=INFO
logging.level.com.baseoauth=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.file.name=logs/baseoauth.log
logging.file.max-size=10MB
logging.file.max-history=30

# =====================================================
# Actuator Configuration
# =====================================================
management.endpoints.web.exposure.include=health,info,metrics,env,beans
management.endpoint.health.show-details=always
management.endpoint.metrics.enabled=true
management.metrics.export.prometheus.enabled=false
management.info.env.enabled=true

# =====================================================
# OAuth2 Configuration
# =====================================================
# OAuth2 Authorization Server
spring.security.oauth2.authorizationserver.issuer=http://localhost:${server.port}
spring.security.oauth2.authorizationserver.endpoint.authorization-uri=/oauth2/authorize
spring.security.oauth2.authorizationserver.endpoint.token-uri=/oauth2/token
spring.security.oauth2.authorizationserver.endpoint.jwk-set-uri=/oauth2/jwks
spring.security.oauth2.authorizationserver.endpoint.token-revocation-uri=/oauth2/revoke
spring.security.oauth2.authorizationserver.endpoint.token-introspection-uri=/oauth2/introspect

# OAuth2 Resource Server
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:${server.port}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:${server.port}/oauth2/jwks

# OAuth2 Client
spring.security.oauth2.client.registration.my-client.client-id=my-trusted-client
spring.security.oauth2.client.registration.my-client.client-secret=secret
spring.security.oauth2.client.registration.my-client.scope=read,write,trust
spring.security.oauth2.client.registration.my-client.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.my-client.redirect-uri=http://localhost:8080/login/oauth2/code/my-client
spring.security.oauth2.client.provider.my-client.issuer-uri=http://localhost:${server.port}

# =====================================================
# JWT Configuration
# =====================================================
jwt.secret-key=my-secret-key-for-jwt-token-generation-1234567890
jwt.expiration-time=3600000
jwt.refresh-expiration-time=86400000

# =====================================================
# CORS Configuration
# =====================================================
cors.allowed.origins=http://localhost:3000,http://localhost:8080
cors.allowed.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
cors.allowed.headers=authorization,content-type,xsrf-token,X-Requested-With,Accept,Accept-Language
cors.exposed.headers=xsrf-token,Authorization,X-XSRF-TOKEN
cors.allow.credentials=true
cors.max.age=3600

# =====================================================
# Spring Boot DevTools
# =====================================================
spring.devtools.livereload.enabled=true
spring.devtools.restart.enabled=true
spring.devtools.restart.additional-paths=src/main/java

# =====================================================
# Session Configuration
# =====================================================
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie

# =====================================================
# HTTP/2 Configuration
# =====================================================
server.http2.enabled=false

# =====================================================
# Compression Configuration
# =====================================================
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain

# =====================================================
# Security Configuration
# =====================================================
security.require-ssl=false
security.enable-csrf=false

